  <body>
    <!-- SPA redirect decoder. Partner of public/404.html. Restores the original path
         from the ?/ query string before React mounts so the router sees the real URL. -->
    <script>
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>

  </body>
