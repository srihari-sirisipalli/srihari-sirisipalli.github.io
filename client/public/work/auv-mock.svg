<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice"><rect width="1600" height="900" fill="#0B1930"/>
  
  <rect x="0" y="0" width="1600" height="64" fill="#132340"/>
  <rect x="0" y="63" width="1600" height="1" fill="#2A3E62"/>
  <rect x="24" y="20" width="24" height="24" rx="4" fill="#B04A2A"/>
  <text x="60" y="40" fill="#F5EFE4" font-family="Inter, sans-serif" font-size="18" font-weight="600">AUV Design Studio &#183; Rev 3</text>
  
    <text x="380" y="40" fill="#F5EFE4" font-family="Inter, sans-serif" font-size="14" font-weight="600">Vehicle</text>
    <rect x="370" y="55" width="70" height="2" fill="#B04A2A"/>
  
    <text x="510" y="40" fill="#B5BFD1" font-family="Inter, sans-serif" font-size="14" font-weight="400">Mission</text>
    
  
    <text x="640" y="40" fill="#B5BFD1" font-family="Inter, sans-serif" font-size="14" font-weight="400">CFD</text>
    
  
    <text x="770" y="40" fill="#B5BFD1" font-family="Inter, sans-serif" font-size="14" font-weight="400">Structure</text>
    
  
    <text x="900" y="40" fill="#B5BFD1" font-family="Inter, sans-serif" font-size="14" font-weight="400">Reports</text>
    
  
  <circle cx="1560" cy="32" r="14" fill="#1B2C4E"/>
  <text x="1560" y="37" fill="#B5BFD1" font-family="Inter, sans-serif" font-size="11" font-weight="600" text-anchor="middle">SS</text>

  <!-- Left: schematic view -->
  <rect x="24" y="88" width="1080" height="600" rx="8" fill="#1B2C4E" stroke="#2A3E62"/>
  <text x="46" y="120" fill="#7B87A0" font-family="Inter, sans-serif" font-size="10" letter-spacing="1.5">VEHICLE ARRANGEMENT &#183; SIDE VIEW</text>
  <defs>
    <linearGradient id="seagrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E3A5F"/>
      <stop offset="1" stop-color="#0F1F35"/>
    </linearGradient>
  </defs>
  <rect x="46" y="140" width="1036" height="380" rx="4" fill="url(#seagrad)"/>
  <!-- surface -->
  <line x1="46" y1="170" x2="1082" y2="170" stroke="#B5BFD1" stroke-width="1" stroke-dasharray="6 6"/>
  <text x="60" y="164" fill="#B5BFD1" font-family="Inter, sans-serif" font-size="10">SURFACE &#183; 0 m</text>
  <!-- seabed -->
  <line x1="46" y1="500" x2="1082" y2="500" stroke="#B5BFD1" stroke-width="1"/>
  <text x="60" y="516" fill="#B5BFD1" font-family="Inter, sans-serif" font-size="10">OPERATING DEPTH &#183; 100 m</text>
  <!-- AUV hull (body-of-revolution) -->
  <g transform="translate(300, 320)">
    <!-- main pressure hull -->
    <path d="M 40 0 Q 60 -40 200 -40 L 380 -40 Q 420 -40 460 0 Q 420 40 380 40 L 200 40 Q 60 40 40 0 Z" fill="none" stroke="#8FA3C4" stroke-width="2.5"/>
    <!-- nose cone (transparent) -->
    <path d="M 40 0 Q 60 -40 200 -40 L 220 -40 L 220 40 L 200 40 Q 60 40 40 0 Z" fill="rgba(228,87,46,0.15)" stroke="none"/>
    <!-- tail -->
    <path d="M 380 -40 L 460 0 L 380 40 Z" fill="rgba(228,87,46,0.15)" stroke="none"/>
    <!-- fins -->
    <polygon points="380,-40 420,-70 430,-40" fill="#B04A2A" opacity="0.85"/>
    <polygon points="380,40 420,70 430,40" fill="#B04A2A" opacity="0.85"/>
    <polygon points="430,-40 460,-58 460,-30" fill="#8FA3C4" opacity="0.6"/>
    <polygon points="430,40 460,58 460,30" fill="#8FA3C4" opacity="0.6"/>
    <!-- multibeam + camera nose -->
    <circle cx="80" cy="0" r="8" fill="#B04A2A"/>
    <rect x="90" y="-4" width="30" height="8" fill="#8FA3C4"/>
    <!-- thruster tail -->
    <circle cx="450" cy="0" r="12" fill="none" stroke="#B04A2A" stroke-width="2"/>
    <line x1="440" y1="-10" x2="460" y2="10" stroke="#B04A2A" stroke-width="2"/>
    <line x1="440" y1="10" x2="460" y2="-10" stroke="#B04A2A" stroke-width="2"/>
    <!-- internal compartments -->
    <line x1="130" y1="-30" x2="130" y2="30" stroke="#5A6B85" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="230" y1="-30" x2="230" y2="30" stroke="#5A6B85" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="330" y1="-30" x2="330" y2="30" stroke="#5A6B85" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="80" y="-6" fill="#F5EFE4" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">SEN</text>
    <text x="180" y="-6" fill="#F5EFE4" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">BAT 1</text>
    <text x="280" y="-6" fill="#F5EFE4" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">BAT 2</text>
    <text x="355" y="-6" fill="#F5EFE4" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">PROP</text>
    <!-- dimensions -->
    <line x1="40" y1="60" x2="460" y2="60" stroke="#7B87A0" stroke-width="1"/>
    <line x1="40" y1="55" x2="40" y2="65" stroke="#7B87A0" stroke-width="1"/>
    <line x1="460" y1="55" x2="460" y2="65" stroke="#7B87A0" stroke-width="1"/>
    <text x="250" y="76" fill="#7B87A0" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">L = 2.80 m</text>
    <line x1="500" y1="-40" x2="500" y2="40" stroke="#7B87A0" stroke-width="1"/>
    <line x1="495" y1="-40" x2="505" y2="-40" stroke="#7B87A0" stroke-width="1"/>
    <line x1="495" y1="40" x2="505" y2="40" stroke="#7B87A0" stroke-width="1"/>
    <text x="516" y="6" fill="#7B87A0" font-family="Inter, sans-serif" font-size="10">D = 0.65 m</text>
    <!-- callout labels -->
    <line x1="180" y1="-40" x2="180" y2="-90" stroke="#7B87A0" stroke-width="1"/>
    <text x="180" y="-98" fill="#F5EFE4" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">Multibeam sonar + camera</text>
    <line x1="280" y1="40" x2="280" y2="98" stroke="#7B87A0" stroke-width="1"/>
    <text x="280" y="118" fill="#F5EFE4" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">CFRP pressure hull</text>
    <line x1="415" y1="-70" x2="500" y2="-100" stroke="#7B87A0" stroke-width="1"/>
    <text x="580" y="-98" fill="#F5EFE4" font-family="Inter, sans-serif" font-size="11">Stabiliser fins</text>
    <line x1="450" y1="12" x2="540" y2="60" stroke="#7B87A0" stroke-width="1"/>
    <text x="560" y="66" fill="#F5EFE4" font-family="Inter, sans-serif" font-size="11">Vectored main thruster &#183; 750 W</text>
  </g>
  <!-- viewport chrome -->
  <text x="1030" y="164" fill="#7B87A0" font-family="Inter, sans-serif" font-size="10" text-anchor="end">1 : 25</text>
  <text x="1030" y="510" fill="#7B87A0" font-family="Inter, sans-serif" font-size="10" text-anchor="end">rev-3 / M+3 URS freeze</text>

  <!-- Left bottom: milestones bar -->
  <rect x="24" y="704" width="1080" height="172" rx="8" fill="#1B2C4E" stroke="#2A3E62"/>
  <text x="46" y="736" fill="#F5EFE4" font-family="Inter, sans-serif" font-size="13" font-weight="600">Programme lifecycle</text>
  <text x="46" y="756" fill="#7B87A0" font-family="Inter, sans-serif" font-size="11">30-month plan &#183; concept &#8594; first-of-class trials</text>
  <!-- timeline -->
  <line x1="80" y1="820" x2="1050" y2="820" stroke="#2A3E62" stroke-width="2"/>
  
    <circle cx="78" cy="820" r="10" fill="#4A8F6B"/>
    <text x="78" y="805" fill="#F5EFE4" font-family="Inter, sans-serif" font-size="11" font-weight="600" text-anchor="middle">M1 &#183; URS</text>
    <text x="78" y="850" fill="#7B87A0" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">2026-03</text>
  
    <circle cx="240" cy="820" r="10" fill="#B04A2A"/>
    <text x="240" y="805" fill="#F5EFE4" font-family="Inter, sans-serif" font-size="11" font-weight="600" text-anchor="middle">M2 &#183; PFS</text>
    <text x="240" y="850" fill="#7B87A0" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">2026-08</text>
  
    <circle cx="425" cy="820" r="10" fill="#B5BFD1"/>
    <text x="425" y="805" fill="#F5EFE4" font-family="Inter, sans-serif" font-size="11" font-weight="600" text-anchor="middle">M3 &#183; PDR</text>
    <text x="425" y="850" fill="#7B87A0" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">2026-11</text>
  
    <circle cx="640" cy="820" r="10" fill="#B5BFD1"/>
    <text x="640" y="805" fill="#F5EFE4" font-family="Inter, sans-serif" font-size="11" font-weight="600" text-anchor="middle">M4 &#183; CDR</text>
    <text x="640" y="850" fill="#7B87A0" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">2027-05</text>
  
    <circle cx="950" cy="820" r="10" fill="#B5BFD1"/>
    <text x="950" y="805" fill="#F5EFE4" font-family="Inter, sans-serif" font-size="11" font-weight="600" text-anchor="middle">M5 &#183; Trials</text>
    <text x="950" y="850" fill="#7B87A0" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">M+30</text>
  

  <!-- Right: specs panel -->
  <rect x="1128" y="88" width="448" height="788" rx="8" fill="#1B2C4E" stroke="#2A3E62"/>
  <text x="1150" y="120" fill="#7B87A0" font-family="Inter, sans-serif" font-size="10" letter-spacing="1.5">DESIGN SYSTEM ENVELOPE</text>
  <text x="1150" y="152" fill="#F5EFE4" font-family="Fraunces, Georgia, serif" font-size="26" font-weight="500">Body-of-revolution AUV</text>
  <text x="1150" y="180" fill="#B5BFD1" font-family="Inter, sans-serif" font-size="13">Sub-100 m class, autonomous survey</text>
  <line x1="1150" y1="200" x2="1554" y2="200" stroke="#2A3E62"/>
  
    <text x="1150" y="240" fill="#7B87A0" font-family="Inter, sans-serif" font-size="10" letter-spacing="1.2">MAX OPERATING DEPTH</text>
    <text x="1150" y="272" fill="#F5EFE4" font-family="Inter, sans-serif" font-size="26" font-weight="600">100 <tspan fill="#7B87A0" font-size="14" font-weight="400">m</tspan></text>
  
    <text x="1150" y="314" fill="#7B87A0" font-family="Inter, sans-serif" font-size="10" letter-spacing="1.2">ONE-WAY RANGE</text>
    <text x="1150" y="346" fill="#F5EFE4" font-family="Inter, sans-serif" font-size="26" font-weight="600">100 <tspan fill="#7B87A0" font-size="14" font-weight="400">mi</tspan></text>
  
    <text x="1150" y="388" fill="#7B87A0" font-family="Inter, sans-serif" font-size="10" letter-spacing="1.2">SPEED ENVELOPE</text>
    <text x="1150" y="420" fill="#F5EFE4" font-family="Inter, sans-serif" font-size="26" font-weight="600">4 – 12 <tspan fill="#7B87A0" font-size="14" font-weight="400">kn</tspan></text>
  
    <text x="1150" y="462" fill="#7B87A0" font-family="Inter, sans-serif" font-size="10" letter-spacing="1.2">ENERGY RESERVE</text>
    <text x="1150" y="494" fill="#F5EFE4" font-family="Inter, sans-serif" font-size="26" font-weight="600">&#8805; 20 <tspan fill="#7B87A0" font-size="14" font-weight="400">%</tspan></text>
  
    <text x="1150" y="536" fill="#7B87A0" font-family="Inter, sans-serif" font-size="10" letter-spacing="1.2">LENGTH &#215; DIAMETER</text>
    <text x="1150" y="568" fill="#F5EFE4" font-family="Inter, sans-serif" font-size="26" font-weight="600">2.80 &#215; 0.65 <tspan fill="#7B87A0" font-size="14" font-weight="400">m</tspan></text>
  
    <text x="1150" y="610" fill="#7B87A0" font-family="Inter, sans-serif" font-size="10" letter-spacing="1.2">DRY MASS</text>
    <text x="1150" y="642" fill="#F5EFE4" font-family="Inter, sans-serif" font-size="26" font-weight="600">182 <tspan fill="#7B87A0" font-size="14" font-weight="400">kg</tspan></text>
  
  <line x1="1150" y1="720" x2="1554" y2="720" stroke="#2A3E62"/>
  <text x="1150" y="750" fill="#7B87A0" font-family="Inter, sans-serif" font-size="10" letter-spacing="1.2">METHOD</text>
  <text x="1150" y="778" fill="#F5EFE4" font-family="Inter, sans-serif" font-size="14">MBSE &#183; V-model &#183; FMEA</text>
  <text x="1150" y="810" fill="#7B87A0" font-family="Inter, sans-serif" font-size="10" letter-spacing="1.2">TEAM</text>
  <text x="1150" y="838" fill="#F5EFE4" font-family="Inter, sans-serif" font-size="14">Lead: Sri Hari Sirisipalli</text>
  <text x="1150" y="858" fill="#B5BFD1" font-family="Inter, sans-serif" font-size="12">Structures, propulsion, systems</text>
</svg>