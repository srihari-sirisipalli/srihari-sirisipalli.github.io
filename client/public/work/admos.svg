  <text x="1070" y="140" fill="#7B87A0" font-family="Inter, sans-serif" font-size="11">Rev-3 baseline &#183; adaptive dual-mode</text>
  <line x1="1070" y1="160" x2="1556" y2="160" stroke="#2A3E62"/>
  
  <rect x="1070" y="180" width="340" height="120" rx="8" fill="#1B2C4E" stroke="#2A3E62"/>
  <text x="1094" y="212" fill="#7B87A0" font-family="Inter, sans-serif" font-size="11" letter-spacing="1.5">ASSET SURVIVAL</text>
  <text x="1094" y="262" fill="#F5EFE4" font-family="Inter, sans-serif" font-size="40" font-weight="600">96.7%</text>
  <text x="1094" y="286" fill="#4A8F6B" font-family="Inter, sans-serif" font-size="12">+18.4 vs. static</text>

  
  <rect x="1070" y="320" width="340" height="120" rx="8" fill="#1B2C4E" stroke="#2A3E62"/>
  <text x="1094" y="352" fill="#7B87A0" font-family="Inter, sans-serif" font-size="11" letter-spacing="1.5">MODE SWITCHES</text>
  <text x="1094" y="402" fill="#F5EFE4" font-family="Inter, sans-serif" font-size="40" font-weight="600">7 &#215; 12</text>
  <text x="1094" y="426" fill="#4A8F6B" font-family="Inter, sans-serif" font-size="12">per UAV, avg 3.4</text>

  
  <rect x="1070" y="460" width="340" height="120" rx="8" fill="#1B2C4E" stroke="#2A3E62"/>
  <text x="1094" y="492" fill="#7B87A0" font-family="Inter, sans-serif" font-size="11" letter-spacing="1.5">END TIME</text>
  <text x="1094" y="542" fill="#F5EFE4" font-family="Inter, sans-serif" font-size="40" font-weight="600">184 s</text>
  <text x="1094" y="566" fill="#4A8F6B" font-family="Inter, sans-serif" font-size="12">target 240 s</text>

  <text x="1070" y="620" fill="#7B87A0" font-family="Inter, sans-serif" font-size="10" letter-spacing="1.5">MODE OCCUPANCY</text>
  <rect x="1070" y="640" width="486" height="24" rx="4" fill="#132340"/>
  <rect x="1070" y="640" width="316" height="24" rx="4" fill="#4A8F6B"/>
  <rect x="1386" y="640" width="170" height="24" fill="#B04A2A"/>
  <text x="1080" y="656" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="11" font-weight="600">Cooperative 65%</text>
  <text x="1396" y="656" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="11" font-weight="600">Auto 35%</text>
  <text x="1070" y="720" fill="#7B87A0" font-family="Inter, sans-serif" font-size="10" letter-spacing="1.5">PREPRINT</text>
  <text x="1070" y="750" fill="#F5EFE4" font-family="Inter, sans-serif" font-size="13">Research Square &#183; rs-9957095</text>
  <text x="1070" y="770" fill="#7B87A0" font-family="Inter, sans-serif" font-size="11">Under review at Discover Vehicles (Springer)</text>
