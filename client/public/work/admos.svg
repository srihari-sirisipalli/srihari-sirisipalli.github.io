<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice"><rect width="1600" height="900" fill="#0B1930"/>
  
  <rect x="0" y="0" width="1600" height="64" fill="#132340"/>
  <rect x="0" y="63" width="1600" height="1" fill="#2A3E62"/>
  <rect x="24" y="20" width="24" height="24" rx="4" fill="#B04A2A"/>
  <text x="60" y="40" fill="#F5EFE4" font-family="Inter, sans-serif" font-size="18" font-weight="600">ADMOS &#183; Dual-Mode Swarm Simulator</text>
  
    <text x="380" y="40" fill="#B5BFD1" font-family="Inter, sans-serif" font-size="14" font-weight="400">Scenario</text>
    
  
    <text x="510" y="40" fill="#F5EFE4" font-family="Inter, sans-serif" font-size="14" font-weight="600">Trajectories</text>
    <rect x="500" y="55" width="70" height="2" fill="#B04A2A"/>
  
    <text x="640" y="40" fill="#B5BFD1" font-family="Inter, sans-serif" font-size="14" font-weight="400">Metrics</text>
    
  
    <text x="770" y="40" fill="#B5BFD1" font-family="Inter, sans-serif" font-size="14" font-weight="400">Paper</text>
    
  
  <circle cx="1560" cy="32" r="14" fill="#1B2C4E"/>
  <text x="1560" y="37" fill="#B5BFD1" font-family="Inter, sans-serif" font-size="11" font-weight="600" text-anchor="middle">SS</text>

  <!-- Left: trajectory plot -->
  <rect x="24" y="88" width="1000" height="788" rx="8" fill="#1B2C4E" stroke="#2A3E62"/>
  <text x="46" y="120" fill="#F5EFE4" font-family="Inter, sans-serif" font-size="13" font-weight="600">Swarm trajectory &#183; asset defence under jamming</text>
  <text x="46" y="140" fill="#7B87A0" font-family="Inter, sans-serif" font-size="11">t = 0 &#8594; 240 s &#183; 12 UAVs &#183; 2 jammer nodes</text>
  <!-- axes -->
  <line x1="80" y1="770" x2="1000" y2="770" stroke="#7B87A0" stroke-width="1"/>
  <line x1="80" y1="180" x2="80" y2="770" stroke="#7B87A0" stroke-width="1"/>
  <text x="500" y="795" fill="#7B87A0" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">x [m]</text>
  <text x="60" y="475" fill="#7B87A0" font-family="Inter, sans-serif" font-size="10" text-anchor="middle" transform="rotate(-90 60 475)">y [m]</text>
  <!-- grid -->
  <line x1="80" y1="180" x2="1000" y2="180" stroke="#2A3E62" stroke-width="0.5" opacity="0.5"/><line x1="80" y1="240" x2="1000" y2="240" stroke="#2A3E62" stroke-width="0.5" opacity="0.5"/><line x1="80" y1="300" x2="1000" y2="300" stroke="#2A3E62" stroke-width="0.5" opacity="0.5"/><line x1="80" y1="360" x2="1000" y2="360" stroke="#2A3E62" stroke-width="0.5" opacity="0.5"/><line x1="80" y1="420" x2="1000" y2="420" stroke="#2A3E62" stroke-width="0.5" opacity="0.5"/><line x1="80" y1="480" x2="1000" y2="480" stroke="#2A3E62" stroke-width="0.5" opacity="0.5"/><line x1="80" y1="540" x2="1000" y2="540" stroke="#2A3E62" stroke-width="0.5" opacity="0.5"/><line x1="80" y1="600" x2="1000" y2="600" stroke="#2A3E62" stroke-width="0.5" opacity="0.5"/><line x1="80" y1="660" x2="1000" y2="660" stroke="#2A3E62" stroke-width="0.5" opacity="0.5"/><line x1="80" y1="720" x2="1000" y2="720" stroke="#2A3E62" stroke-width="0.5" opacity="0.5"/>
  <line x1="80" y1="180" x2="80" y2="770" stroke="#2A3E62" stroke-width="0.5" opacity="0.5"/><line x1="140" y1="180" x2="140" y2="770" stroke="#2A3E62" stroke-width="0.5" opacity="0.5"/><line x1="200" y1="180" x2="200" y2="770" stroke="#2A3E62" stroke-width="0.5" opacity="0.5"/><line x1="260" y1="180" x2="260" y2="770" stroke="#2A3E62" stroke-width="0.5" opacity="0.5"/><line x1="320" y1="180" x2="320" y2="770" stroke="#2A3E62" stroke-width="0.5" opacity="0.5"/><line x1="380" y1="180" x2="380" y2="770" stroke="#2A3E62" stroke-width="0.5" opacity="0.5"/><line x1="440" y1="180" x2="440" y2="770" stroke="#2A3E62" stroke-width="0.5" opacity="0.5"/><line x1="500" y1="180" x2="500" y2="770" stroke="#2A3E62" stroke-width="0.5" opacity="0.5"/><line x1="560" y1="180" x2="560" y2="770" stroke="#2A3E62" stroke-width="0.5" opacity="0.5"/><line x1="620" y1="180" x2="620" y2="770" stroke="#2A3E62" stroke-width="0.5" opacity="0.5"/><line x1="680" y1="180" x2="680" y2="770" stroke="#2A3E62" stroke-width="0.5" opacity="0.5"/><line x1="740" y1="180" x2="740" y2="770" stroke="#2A3E62" stroke-width="0.5" opacity="0.5"/><line x1="800" y1="180" x2="800" y2="770" stroke="#2A3E62" stroke-width="0.5" opacity="0.5"/><line x1="860" y1="180" x2="860" y2="770" stroke="#2A3E62" stroke-width="0.5" opacity="0.5"/><line x1="920" y1="180" x2="920" y2="770" stroke="#2A3E62" stroke-width="0.5" opacity="0.5"/><line x1="980" y1="180" x2="980" y2="770" stroke="#2A3E62" stroke-width="0.5" opacity="0.5"/>
  <!-- asset (centre) -->
  <circle cx="540" cy="475" r="18" fill="#B04A2A"/>
  <text x="540" y="513" fill="#F5EFE4" font-family="Inter, sans-serif" font-size="10" text-anchor="middle" font-weight="600">ASSET</text>
