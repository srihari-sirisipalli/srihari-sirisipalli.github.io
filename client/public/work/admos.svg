  <circle cx="210" cy="305" r="140" fill="none" stroke="#D4A02E" stroke-width="1" stroke-dasharray="6 6" opacity="0.6"/>
  <circle cx="890" cy="655" r="140" fill="none" stroke="#D4A02E" stroke-width="1" stroke-dasharray="6 6" opacity="0.6"/>
  <!-- UAV trajectories (cooperative curves) -->
  <path d="M 100 400 Q 300 350 540 460 T 900 380" fill="none" stroke="#4A8F6B" stroke-width="2" opacity="0.75"/><path d="M 900 220 Q 720 320 560 450 T 220 700" fill="none" stroke="#4A8F6B" stroke-width="2" opacity="0.75"/><path d="M 120 700 Q 320 620 540 490 T 950 500" fill="none" stroke="#4A8F6B" stroke-width="2" opacity="0.75"/><path d="M 720 200 Q 620 300 540 470 T 400 720" fill="none" stroke="#4A8F6B" stroke-width="2" opacity="0.75"/><path d="M 400 220 Q 470 320 540 480 T 760 720" fill="none" stroke="#4A8F6B" stroke-width="2" opacity="0.75"/>
  <!-- UAV markers at t_final -->
  
    <polygon points="900,372 908,386 892,386" fill="#5E82B8"/>
  
    <polygon points="220,692 228,706 212,706" fill="#5E82B8"/>
  
    <polygon points="950,492 958,506 942,506" fill="#5E82B8"/>
  
    <polygon points="400,712 408,726 392,726" fill="#5E82B8"/>
  
    <polygon points="760,712 768,726 752,726" fill="#5E82B8"/>
  
  <!-- Legend -->
  <rect x="700" y="200" width="290" height="120" rx="4" fill="#132340" opacity="0.9"/>
  <line x1="710" y1="220" x2="740" y2="220" stroke="#4A8F6B" stroke-width="2"/>
  <text x="750" y="224" fill="#F5EFE4" font-family="Inter, sans-serif" font-size="11">Cooperative mode (agree)</text>
  <line x1="710" y1="245" x2="740" y2="245" stroke="#B04A2A" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="750" y="249" fill="#F5EFE4" font-family="Inter, sans-serif" font-size="11">Autonomous fallback (jammed)</text>
  <polygon points="720,270 730,278 710,278" fill="#5E82B8"/>
  <text x="750" y="278" fill="#F5EFE4" font-family="Inter, sans-serif" font-size="11">UAV terminal position</text>
  <polygon points="710,295 730,285 730,305 710,300" fill="#D4A02E"/>
  <text x="750" y="304" fill="#F5EFE4" font-family="Inter, sans-serif" font-size="11">Jammer + effective radius</text>

  <!-- Right: metrics panel -->
  <rect x="1048" y="88" width="528" height="788" rx="8" fill="#1B2C4E" stroke="#2A3E62"/>
