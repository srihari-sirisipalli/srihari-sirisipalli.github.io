  <text x="180" y="285" fill="#D4A02E" font-family="Inter, sans-serif" font-size="10">JAM 1</text>
  <polygon points="880,650 900,640 900,670 880,660" fill="#D4A02E"/>
  <text x="920" y="655" fill="#D4A02E" font-family="Inter, sans-serif" font-size="10">JAM 2</text>
